<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#14241f"><meta name="description" content="Mon programme Upper Lower Push Pull à domicile"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>My Home Gym</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#17261f;background:#f4f7f5}*{box-sizing:border-box}body{margin:0}header{background:#14241f;color:white;padding:25px 17px 21px}header h1{margin:4px 0;font-size:27px}header p{margin:0;color:#d0ded5}.wrap{max-width:740px;margin:auto;padding:14px}button{font:inherit;cursor:pointer}nav{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}.day{border:1px solid #d4ddd6;background:white;padding:12px 3px;border-radius:12px;font-weight:650;font-size:13px}.day span{font-weight:400;color:#627167;font-size:11px;display:block}.day.active{background:#176848;color:white}.day.active span{color:#e0f4e8}.tabs{display:flex;background:#e5ece7;border-radius:12px;padding:4px;gap:4px}.tab{flex:1;padding:11px 6px;background:transparent;border:0;border-radius:9px}.tab.active{background:white;font-weight:700;box-shadow:0 1px 4px #0001}.card{background:white;border:1px solid #e0e8e2;border-radius:15px;padding:14px;margin-top:12px}.card h2{font-size:19px;margin:0 0 6px}.muted{color:#607168;font-size:13px}h3{font-size:16px;margin:12px 0 8px}.exercise{display:flex;align-items:center;width:100%;text-align:left;gap:11px;background:white;border:1px solid #e0e8e2;border-radius:12px;padding:13px 10px;margin-top:7px}.exercise.active{border:2px solid #176848;background:#f1f8f4}.num{flex:none;display:grid;place-items:center;width:32px;height:32px;border-radius:9px;background:#e8f0ea;font-weight:800}.details{flex:1;min-width:0}.details strong{display:block;font-size:14px}.details small{display:block;color:#65736a;margin-top:3px}.arrow{font-size:20px;color:#577062}.photo{display:block;width:100%;max-height:350px;object-fit:contain;background:#e9eee9;border-radius:10px;margin-top:10px}.photo-fallback{background:#eaf0ec;padding:28px 18px;text-align:center;border-radius:10px;color:#4d6657;margin-top:10px}.photo-fallback svg{max-width:90px;display:block;margin:0 auto 10px}.pill{display:inline-block;background:#dcefe3;color:#155338;border-radius:99px;font-size:12px;padding:4px 10px;font-weight:750}.big{font-size:26px;font-weight:800;margin:8px 0}.primary,.secondary{border-radius:11px;padding:12px 15px;font-weight:700;border:0}.primary{background:#176848;color:white}.secondary{background:#e5ece7;color:#223c2d}.full{width:100%}.row{display:flex;gap:8px;align-items:center;justify-content:space-between}.row>button{flex:1}label{display:block;color:#52665a;font-size:13px;margin:10px 0 5px}input{font:inherit;border:1px solid #ceddd2;border-radius:9px;padding:10px;width:100%}.circuit{display:flex;gap:9px;align-items:center;padding:10px 0;border-bottom:1px solid #e9efeb}.circuit b{background:#e9f2eb;border-radius:8px;padding:8px;font-size:12px;min-width:85px;text-align:center}.cardio-item{background:white;border:1px solid #e0e8e2;border-radius:14px;padding:12px;margin-top:12px}.cardio-item h3{margin:0 0 3px}.cardio-item p{margin:3px 0 0}.thumb{display:block;width:100%;max-height:230px;object-fit:contain;background:#edf1ee;border-radius:10px;margin-top:10px}footer{text-align:center;font-size:11px;color:#738177;margin:24px 0}a{color:#176848}@media(min-width:630px){.wrap{padding:22px}.day{font-size:15px}}
</style></head><body><header><div style="max-width:740px;margin:auto"><div style="font-size:12px;letter-spacing:.13em;color:#a5ddb9">MON HOME GYM</div><h1>Mon programme 💪</h1><p>4 séances / semaine · 15 min cardio + 45 min musculation</p></div></header><main class="wrap"><nav id="days" aria-label="Séances"></nav><div class="tabs"><button class="tab active" data-tab="muscu">🏋️ Musculation</button><button class="tab" data-tab="cardio">❤️ Cardio</button></div><div id="app"></div><footer>Le suivi est enregistré localement sur cet appareil. Les photos nécessitent Internet lors du premier affichage.</footer></main><script>
const IMG='https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/';
const E=(name,reps,muscle,tip,img)=>({name,reps,muscle,tip,img});
const C=(name,duration,img,tip)=>({name,duration,img,tip});
const sessions=[
{day:'Lundi',name:'Upper',focus:'Haut du corps',format:'1 min par exercice · 3 tours',cardio:[
C('Corde à sauter classique','1 min','Jump_Rope','Rythme modéré, petits rebonds et épaules relâchées.'),
C('Jumping jacks','1 min','Jumping_Jacks','Ouvre et ferme bras et jambes de manière fluide.'),
C('Montées de genoux','1 min','High_Knees','Monte les genoux à hauteur modérée en gardant le buste droit.'),
C('Shadow boxing','1 min','Shadow_Boxing','Enchaîne des coups simples tout en restant léger sur les appuis.'),
C('Pas latéraux dynamiques','1 min','Lateral_Shuffles','Déplace-toi de droite à gauche en gardant une légère flexion des genoux.')
],ex:[
E('Développé couché avec haltères','3 × 8–12','Pectoraux','Serre les omoplates et descends de façon contrôlée.','Dumbbell_Bench_Press'),E('Tirage vertical à la machine','3 × 8–12','Dos','Tire vers le haut de la poitrine sans balancer le buste.','Wide-Grip_Lat_Pulldown'),E('Développé Arnold','2 × 10–12','Épaules','Tourne progressivement les mains en poussant.','Arnold_Dumbbell_Press'),E('Rowing horizontal à la poulie basse','3 × 10–12','Dos','Ramène la poignée vers l’abdomen.','Seated_Cable_Rows'),E('Curl biceps avec haltères','2 × 10–15','Biceps','Conserve les coudes près du corps.','Dumbbell_Bicep_Curl'),E('Extension triceps à la poulie haute','2 × 10–15','Triceps','Garde les coudes immobiles.','Triceps_Pushdown')]},
{day:'Mardi',name:'Lower',focus:'Jambes et abdominaux',format:'1 min par exercice · 3 tours',cardio:[
C('Corde à sauter légère','1 min','Jump_Rope','Reste léger sur les appuis pour préserver les jambes.'),
C('Squats au poids du corps','1 min','Bodyweight_Squat','Descends de façon contrôlée, poitrine ouverte.'),
C('Talons-fesses','1 min','Butt_Kicks','Ramène les talons vers les fessiers à rythme modéré.'),
C('Pas latéraux avec flexion','1 min','Side_Steps','Fais des pas de côté avec une légère flexion des genoux.'),
C('Mobilité des hanches et chevilles','1 min','Hip_Mobility','Mouvements dynamiques pour préparer les articulations.')
],ex:[
E('Goblet squat','3 × 10–12','Quadriceps · Fessiers','Tiens l’haltère devant la poitrine et descends le dos neutre.','Goblet_Squat'),E('Soulevé de terre roumain','3 × 8–12','Ischio-jambiers · Fessiers','Pousse les hanches vers l’arrière.','Romanian_Deadlift'),E('Fentes bulgares','2 × 10/jambe','Quadriceps · Fessiers','Pied arrière sur le banc, descends en contrôle.','Split_Squat_with_Dumbbells'),E('Leg extension à la machine','2 × 12–15','Quadriceps','Étends les jambes sans à-coup.','Leg_Extensions'),E('Leg curl au sol avec élastique','2 × 12–15','Ischio-jambiers','Fixe l’élastique en bas et ramène les talons aux fessiers.','Lying_Leg_Curls'),E('Mollets debout avec haltères','2 × 15–20','Mollets','Monte sur la pointe des pieds puis redescends lentement.','Standing_Dumbbell_Calf_Raise'),E('Gainage abdominal','2 × 30–45 s','Abdominaux','Maintiens le corps aligné.','Plank')]},
{day:'Jeudi',name:'Push',focus:'Pectoraux · Épaules · Triceps',format:'30 s effort + 30 s récupération active · 3 tours',cardio:[
C('Corde à sauter, pas du boxeur','30 s + 30 s','Jump_Rope','Alterne les appuis comme un boxeur, sans forcer le rythme.'),
C('Mountain climbers debout','30 s + 30 s','Standing_Mountain_Climber','Ramène les genoux vers la poitrine en position debout.'),
C('Skaters','30 s + 30 s','Skaters','Effectue des sauts latéraux contrôlés.'),
C('Shadow boxing rapide','30 s + 30 s','Shadow_Boxing','Rythme un peu plus élevé, bras relâchés.'),
C('Jumping jacks','30 s + 30 s','Jumping_Jacks','Mouvement continu, sans te crisper.')
],ex:[
E('Développé incliné avec haltères','3 × 8–12','Pectoraux','Banc environ 30°, descends les haltères en contrôle.','Incline_Dumbbell_Press'),E('Chest press à la machine','3 × 10–12','Pectoraux','Pousse les poignées devant toi.','Leverage_Chest_Press'),E('Développé militaire avec haltères','2 × 8–12','Épaules','Évite de cambrer excessivement.','Dumbbell_Shoulder_Press'),E('Élévations latérales','3 × 12–15','Épaules','Lève les bras sans hausser les épaules.','Side_Lateral_Raise'),E('Extension triceps à la poulie haute','2 × 10–15','Triceps','Garde les coudes près du corps.','Triceps_Pushdown'),E('Extension triceps au-dessus de la tête','2 × 10–12','Triceps','Fléchis puis tends les coudes sans balancer.','Seated_Triceps_Press')]},
{day:'Samedi',name:'Pull',focus:'Dos · Arrière d’épaules · Biceps',format:'1 min par exercice · 3 tours',cardio:[
C('Corde à sauter, pieds alternés','1 min','Jump_Rope','Alterner les pieds de façon régulière.'),
C('Genoux-coudes croisés','1 min','Standing_Cross_Crunch','Monte le genou vers le coude opposé en gardant le buste haut.'),
C('Pas chassés latéraux','1 min','Lateral_Shuffles','Déplacements rapides de droite à gauche.'),
C('Fentes arrière alternées','1 min','Reverse_Lunge','Alterne les jambes sans te précipiter.'),
C('Corde à sauter classique','1 min','Jump_Rope','Garde un rythme stable pour finir le tour.')
],ex:[
E('Tractions à la barre fixe','3 × 6–10','Dos · Biceps','Utilise un élastique d’assistance au besoin.','Pullups'),E('Rowing unilatéral avec haltère','3 × 10–12/bras','Dos','Appuie-toi sur le banc et tire vers la hanche.','One-Arm_Dumbbell_Row'),E('Tirage vertical, prise différente','2 × 10–12','Dos','Choisis une prise confortable et différente du lundi.','Close-Grip_Front_Lat_Pulldown'),E('Oiseau avec haltères','2 × 12–15','Arrière d’épaules','Buste penché, ouvre les bras en contrôle.','Bent_Over_Dumbbell_Rear_Delt_Raise_With_Head_On_Bench'),E('Face pull avec élastique','2 × 12–15','Arrière d’épaules','Tire l’élastique vers le visage, coudes ouverts.','Face_Pull'),E('Curl biceps avec barre','2 × 8–12','Biceps','Évite l’élan du buste.','Barbell_Curl'),E('Curl marteau avec haltères','2 × 10–12','Biceps · Brachial','Garde les paumes face à face.','Hammer_Curls')]}];
const $=x=>document.querySelector(x);let day=0,tab='muscu',sel=0;
const safeLoad=(k,fallback)=>{try{return JSON.parse(localStorage.getItem(k))??fallback}catch{return fallback}};
let finished=safeLoad('mhg-finished',{}),loads=safeLoad('mhg-loads',{});
function save(){localStorage.setItem('mhg-finished',JSON.stringify(finished));localStorage.setItem('mhg-loads',JSON.stringify(loads))}
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function draw(){let s=sessions[day];$('#days').innerHTML=sessions.map((x,i)=>`<button class="day ${day===i?'active':''}" data-day="${i}"><span>${x.day}</span>${x.name}</button>`).join('');document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));if(tab==='cardio'){drawCardio();return}let n=s.ex.filter((_,i)=>finished[day+'-'+i]).length;$('#app').innerHTML=`<div class="card"><h2>${s.day} — ${s.name}</h2><div class="muted">${s.focus} · ${n}/${s.ex.length} exercices terminés</div><div style="height:7px;border-radius:9px;background:#e5eee6;margin-top:11px"><div style="height:7px;border-radius:9px;background:#176848;width:${100*n/s.ex.length}%"></div></div></div><h3>Touche un exercice pour voir sa photo</h3>`+s.ex.map((e,i)=>`<button class="exercise ${sel===i?'active':''}" data-ex="${i}"><span class="num">${finished[day+'-'+i]?'✓':i+1}</span><span class="details"><strong>${esc(e.name)}</strong><small>${e.reps} · ${e.muscle}</small></span><span class="arrow">${sel===i?'⌄':'›'}</span></button>${sel===i?detail(e,i):''}`).join('');let image=$('#ex-photo');if(image){image.addEventListener('error',()=>{image.hidden=true;$('#image-fallback').hidden=false})}}
function detail(e,i){let k=day+'-'+i;return `<div class="card"><span class="pill">${esc(e.muscle)}</span><h2 style="margin-top:8px">${esc(e.name)}</h2><img id="ex-photo" class="photo" src="${IMG+e.img+'/0.jpg'}" alt="Illustration de ${esc(e.name)}" loading="lazy"><div id="image-fallback" class="photo-fallback" hidden>📷 Photo indisponible pour cet exercice.<br><a href="https://www.google.com/search?tbm=isch&q=${encodeURIComponent(e.name+' exercice musculation')}" target="_blank" rel="noopener">Voir des photos de l'exercice ↗</a></div><div class="big">${e.reps}</div><p>${esc(e.tip)}</p><label for="load">Charge utilisée (kg), facultatif</label><input id="load" type="number" min="0" step="0.5" inputmode="decimal" value="${esc(loads[k]??'')}" placeholder="Ex. 12"><button style="margin-top:12px" class="primary full" id="finish">${finished[k]?'✓ Terminé — toucher pour annuler':'✓ Marquer comme terminé'}</button><div class="row" style="margin-top:10px"><button class="secondary" id="prev" ${i===0?'disabled':''}>← Précédent</button><button class="secondary" id="next" ${i===sessions[day].ex.length-1?'disabled':''}>Suivant →</button></div></div>`}
function drawCardio(){let s=sessions[day];$('#app').innerHTML=`<div class="card"><span class="pill">CARDIO · 15 MIN</span><h2 style="margin-top:8px">${s.day} — ${s.name}</h2><p class="muted">${s.format}</p><p style="margin-top:10px">Fais les exercices ci-dessous dans l'ordre, puis répète tout le circuit 3 fois.</p></div>` + s.cardio.map((c,i)=>`<div class="cardio-item"><div class="row" style="align-items:flex-start"><div><span class="pill">Exercice ${i+1}</span><h3>${esc(c.name)}</h3><p class="muted">${esc(c.duration)}</p></div></div><img class="thumb cardio-photo" data-search="${encodeURIComponent(c.name+' exercice cardio')}" src="${IMG+c.img+'/0.jpg'}" alt="Illustration de ${esc(c.name)}" loading="lazy"><div class="photo-fallback" hidden>📷 Photo indisponible pour cet exercice.<br><a href="https://www.google.com/search?tbm=isch&q=${encodeURIComponent(c.name+' exercice cardio') }" target="_blank" rel="noopener">Voir des photos de l'exercice ↗</a></div><p>${esc(c.tip)}</p></div>`).join('') + `<button class="primary full" id="go-muscu" style="margin-top:15px">Passer à la musculation →</button>`;
 document.querySelectorAll('.cardio-photo').forEach(img=>{img.addEventListener('error',()=>{img.hidden=true; let fb=img.nextElementSibling; if(fb)fb.hidden=false;});});
}
document.addEventListener('click',ev=>{let b=ev.target.closest('button');if(!b)return;if(b.dataset.day!==undefined){day=+b.dataset.day;sel=0;draw()}else if(b.dataset.tab){tab=b.dataset.tab;draw()}else if(b.dataset.ex!==undefined){sel=+b.dataset.ex;draw()}else if(b.id==='finish'){let k=day+'-'+sel;finished[k]=!finished[k];save();draw()}else if(b.id==='next'||b.id==='prev'){sel+=b.id==='next'?1:-1;draw()}else if(b.id==='go-muscu'){tab='muscu';draw()}});
document.addEventListener('change',ev=>{if(ev.target.id==='load'){loads[day+'-'+sel]=ev.target.value;save()}});
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));draw();
</script></body></html>
